# First-person bio shown when "Full text bio" is clicked.
bio:
  - >-
    I work on machine learning for small-molecule discovery, with a focus on settings
    where data is scarce: predicting what a molecule does when only a handful of
    measurements exist. During my PhD I developed MHNfs, a few-shot model for
    bioactivity prediction. Since then I have worked on generative models for chemical
    and biological sequences, and on measuring how well language models reason about chemistry.
  - >-
    I joined the Computational and Biological Learning group in Cambridge in September
    2026, working with José Miguel Hernández-Lobato. Before that I did my PhD and a
    postdoc at the Institute for Machine Learning at JKU Linz with Günter Klambauer and
    Sepp Hochreiter. I originally trained as a mathematics and physics teacher.

# Third-person bio for organisers (copied by the "Copy bio" button).
speaker_bio: >-
  Johannes Schimunek is a Research Associate in the Computational and Biological
  Learning group at the University of Cambridge, working with José Miguel
  Hernández-Lobato on machine learning for small-molecule discovery when data is
  scarce: few-shot bioactivity prediction, generative models for chemical and
  biological sequences, and chemical reasoning in language models. Johannes completed
  a PhD and a postdoc at the Institute for Machine Learning at JKU Linz with Günter
  Klambauer and Sepp Hochreiter and developed MHNfs, a few-shot model for
  bioactivity prediction.

